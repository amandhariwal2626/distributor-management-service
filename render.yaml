services:
  - type: web
    name: dms-api
    runtime: node
    repo: https://github.com/your-org/dms
    plan: free
    region: oregon
    buildCommand: npm install && npm run build -w @dms/database && npm run build -w @dms/api
    startCommand: bash apps/api/render-start.sh
    healthCheckPath: /api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dms-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_TTL_DAYS
        value: 7

databases:
  - name: dms-db
    databaseName: dms
    plan: free
    region: oregon
    ipAllowList: []
