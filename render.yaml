services:
  - type: web
    name: dms-api
    runtime: node
    repo: https://github.com/amandhariwal2626/distributor-management-service.git
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build -w @dms/validations && npm run build -w @dms/api
    startCommand: bash apps/api/render-start.sh
    healthCheckPath: /api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_TTL_DAYS
        value: 7

